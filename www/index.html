<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>锐捷路由器 · RUIJIE</title>
<style>
  :root{--bg:#fff;--card:#fff;--border:#e4e7ed;--text:#303133;--muted:#909399;--dim:#a8abb2;--field:#fff;--field-border:#dcdfe6;--soft:#f5f7fa;--primary:#409eff;--primary-dark:#337ecc;--success:#67c23a;--danger:#f56c6c;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  html[data-theme="dark"]{--bg:#121212;--card:#141414;--border:#1f2937;--text:#e5eaf3;--muted:#a3a6ad;--dim:#8d9095;--field:#1d1e1f;--field-border:#4c4d4f;--soft:#191a1c}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .page{max-width:1200px;margin:0 auto;padding:24px 24px 48px}
  .head{display:flex;align-items:center;gap:12px;padding:4px 0 16px;margin-bottom:18px;border-bottom:1px solid var(--border)}
  .head-icon{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(64,158,255,.12);color:var(--primary)}
  .head-icon svg{width:22px;height:22px}
  .head-text{min-width:0;flex:1}
  .head-text h1{margin:0;font-size:18px;font-weight:700;line-height:26px}
  .head-text p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:17px}
  .head-actions{display:flex;gap:8px;flex:none}
  .card{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:20px 22px;margin-bottom:16px}
  .card h2{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card h2 .hint{font-size:12px;font-weight:400;color:var(--muted)}
  .form{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:12px 14px;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font-size:12px;color:var(--muted)}
  .field input{height:38px;border:1px solid var(--field-border);background:var(--field);color:var(--text);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
  .field input:focus{border-color:var(--primary)}
  .form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button{height:38px;padding:0 18px;border-radius:8px;border:1px solid var(--field-border);background:var(--card);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s}
  button:hover{border-color:var(--primary);color:var(--primary)}
  button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  button.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
  button:disabled{opacity:.55;cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 26px}
  .kv{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border)}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--muted);flex:none}
  .kv b{font-weight:600;word-break:break-all;text-align:right}
  .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
  .row{display:flex;align-items:center;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--dim);font-weight:600;font-size:12px;background:var(--soft)}
  td.mono{font-family:var(--mono);font-size:12.5px}
  .status{margin-top:12px;font-size:12.5px;color:var(--muted);min-height:18px}
  .status.ok{color:var(--success)}
  .status.err{color:var(--danger)}
  .empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(48,49,51,.94);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:88vw}
  .toast.show{opacity:1}
  @media(max-width:820px){.form{grid-template-columns:1fr}.page{padding:16px 14px 32px}.card{padding:16px 15px}}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div class="head-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 17.5h.01M10 17.5h.01M17 9V4M17 4l-3 3M17 4l3 3"/></svg></div>
    <div class="head-text">
      <h1>锐捷路由器</h1>
      <p id="sub">正在读取路由器状态…</p>
    </div>
    <div class="head-actions">
      <button id="refresh">刷新</button>
    </div>
  </header>

  <section class="card">
    <h2>连接设置 <span class="hint">登录锐捷 EWeb，只读获取状态与终端列表</span></h2>
    <div class="form">
      <div class="field">
        <label for="host">路由器地址</label>
        <input id="host" placeholder="192.168.110.1" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" placeholder="admin" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="留空表示不修改已保存的密码" autocomplete="new-password" />
      </div>
    </div>
    <div class="form-actions">
      <button class="primary" id="save">保存并连接</button>
      <button id="test">测试连接</button>
    </div>
    <div class="status" id="settings-status"></div>
  </section>

  <section id="content"></section>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var saved = 'auto';
  try { saved = localStorage.getItem('vueuse-color-scheme') || 'auto'; } catch(e) {}
  if (saved !== 'light' && saved !== 'dark') {
    saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', saved);
})();

var $ = function(id){ return document.getElementById(id); };
var hostEl = $('host'), userEl = $('username'), passEl = $('password');
var settingsStatus = $('settings-status'), content = $('content'), sub = $('sub');

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function dur(sec){
  sec = Number(sec) || 0;
  var d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
  return (d ? d + ' 天 ' : '') + h + ' 小时 ' + m + ' 分';
}
function mb(kb){ return (Number(kb||0)/1024).toFixed(0) + ' MB'; }
function kv(k, v){ return '<div class="kv"><span>' + esc(k) + '</span><b>' + esc(v || '—') + '</b></div>'; }

function toast(msg, isErr){
  var t = $('toast');
  t.textContent = msg;
  t.style.background = isErr ? 'rgba(245,108,108,.96)' : 'rgba(48,49,51,.94)';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

function setSettingsStatus(msg, kind){
  settingsStatus.textContent = msg || '';
  settingsStatus.className = 'status' + (kind ? ' ' + kind : '');
}

function api(path, opts){
  return fetch('api/router/' + path, opts || {cache:'no-store'}).then(function(r){
    return r.json().catch(function(){ throw new Error('返回内容无法解析'); });
  });
}

function renderInfo(d){
  var mem = d.mem_total ? Math.min(100, Math.round((d.mem_used || 0) * 100 / d.mem_total)) : 0;
  var rows = (d.clients || []).map(function(c){
    return '<tr><td class="mono">' + esc(c.ip) + '</td><td class="mono">' + esc(c.mac) +
      '</td><td>' + esc(c.interface || c.device || '') + '</td></tr>';
  }).join('') || '<tr><td colspan="3" class="empty">暂无终端</td></tr>';

  sub.textContent = (d.host || '') + (d.model ? ' · ' + d.model : '') + (d.hostname ? ' · ' + d.hostname : '');

  content.innerHTML =
    '<section class="card"><h2>设备概况</h2><div class="grid">' +
      kv('型号', d.model) + kv('主机名', d.hostname) + kv('固件版本', d.firmware) +
      kv('硬件版本', d.hardware) + kv('运行时长', dur(d.uptime)) + kv('厂商', d.vendor) +
    '</div></section>' +
    '<section class="card"><h2>内存</h2>' +
      '<div class="row" style="justify-content:space-between;font-size:13px"><span style="color:var(--muted)">已用 ' +
      mb(d.mem_used) + ' / 共 ' + mb(d.mem_total) + '</span><b>' + mem + '%</b></div>' +
      '<div class="bar"><i style="width:' + mem + '%"></i></div>' +
    '</section>' +
    '<section class="card"><h2>网络</h2><div class="grid">' +
      kv('WAN 地址', d.wan_ip) + kv('工作模式', d.mode === 'none' ? '路由模式' : d.mode) +
      kv('在线终端', (d.client_count != null ? d.client_count : (d.clients || []).length) + ' 台') +
      kv('设备时间', d.local_time) +
    '</div></section>' +
    '<section class="card"><h2>在线终端（ARP）</h2><table><thead><tr><th>IP 地址</th><th>MAC 地址</th><th>接口</th></tr></thead><tbody>' +
      rows + '</tbody></table></section>';
}

function loadAll(){
  settingsStatus.textContent = '';
  return api('all').then(function(j){
    if (j.code !== 200) throw new Error(j.message || '读取失败');
    renderInfo(j.data || {});
  }).catch(function(e){
    sub.textContent = '尚未连接路由器';
    content.innerHTML = '<section class="card"><h2>无法连接路由器</h2><div class="empty">' +
      esc(e.message || e) + '<br /><br />请在上方填写地址与账号后点击「保存并连接」。</div></section>';
  });
}

function loadConfig(){
  return api('config').then(function(j){
    if (j.code !== 200) return;
    var c = j.data || {};
    hostEl.value = c.host || '';
    userEl.value = c.username || '';
    passEl.value = '';
    if (c.host) {
      setSettingsStatus('已保存：' + c.host + ' · ' + (c.username || ''), 'ok');
    } else {
      setSettingsStatus('尚未配置路由器，请填写地址与账号。');
    }
  }).catch(function(){});
}

function postConfig(kind){
  var body = {
    host: hostEl.value.trim(),
    username: userEl.value.trim(),
    password: passEl.value
  };
  if (!body.host) { toast('请填写路由器地址', true); return; }
  if (!body.username) { toast('请填写用户名', true); return; }
  if (!body.password && !kind) { toast('请填写密码', true); return; }

  var btns = [$('save'), $('test')];
  btns.forEach(function(b){ b.disabled = true; });
  setSettingsStatus(kind === 'test' ? '正在测试连接…' : '正在保存并连接…');

  api(kind === 'test' ? 'test' : 'config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(j){
    if (j.code !== 200) throw new Error(j.message || '操作失败');
    if (j.data && j.data.connected === false) {
      setSettingsStatus(j.message || '配置已保存，但连接失败', 'err');
      toast('配置已保存，但连接失败', true);
      return;
    }
    passEl.value = '';
    setSettingsStatus('连接成功 · ' + new Date().toLocaleTimeString(), 'ok');
    toast(kind === 'test' ? '连接成功' : '已保存并连接');
    return loadAll();
  }).catch(function(e){
    setSettingsStatus(e.message || String(e), 'err');
    toast(e.message || String(e), true);
  }).finally(function(){
    btns.forEach(function(b){ b.disabled = false; });
  });
}

$('save').addEventListener('click', function(){ postConfig('save'); });
$('test').addEventListener('click', function(){ postConfig('test'); });
$('refresh').addEventListener('click', function(){
  loadAll().then(function(){ toast('已刷新'); });
});
passEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter') postConfig('save');
});

loadConfig().then(loadAll);
</script>
</body>
</html>
